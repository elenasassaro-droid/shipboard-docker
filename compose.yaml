services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shipboard
      POSTGRES_USER: shipboard
      POSTGRES_PASSWORD: shipboard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipboard -d shipboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src/ShipBoard.Api
    environment:
      ConnectionStrings__shipboard: Host=db;Port=5432;Database=shipboard;Username=shipboard;Password=shipboard
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      API_URL: http://api:8080
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres-data:
