name: deploy

# Dopo che la CI e' verde su main: build delle immagini, push su ACR, aggiornamento delle Container Apps.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # serve per il login OIDC ad Azure, nessun secret salvato

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    env:
      ACR: ${{ vars.ACR_NAME }}
      RG: ${{ vars.RESOURCE_GROUP }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name "$ACR"

      - uses: docker/setup-buildx-action@v3

      - name: Build e push API
        uses: docker/build-push-action@v6
        with:
          context: src/ShipBoard.Api
          push: true
          tags: ${{ env.ACR }}.azurecr.io/shipboard-api:${{ env.TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build e push frontend
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ env.ACR }}.azurecr.io/shipboard-web:${{ env.TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Aggiorna le Container Apps
        run: |
          az containerapp update -n shipboard-api -g "$RG" \
            --image "$ACR.azurecr.io/shipboard-api:$TAG" --set-env-vars APP_VERSION="${TAG::7}" -o none
          az containerapp update -n shipboard-web -g "$RG" \
            --image "$ACR.azurecr.io/shipboard-web:$TAG" -o none
          echo "https://$(az containerapp show -n shipboard-web -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_STEP_SUMMARY"
